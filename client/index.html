<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusCoder — AI Agent Coding Studio</title>
    <meta name="description" content="Autonomous AI Agentic Coding Studio powered by OpenRouter API" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      /* Inline boot screen: paints immediately, before any bundle is parsed,
         so the window is never an empty black rectangle. */
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #070913; color: #94a3b8; z-index: 9999;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #boot .mark {
        width: 56px; height: 56px; border-radius: 14px;
        object-fit: cover;
        box-shadow: 0 8px 30px rgba(6, 182, 212, .35);
        border: 1px solid rgba(6, 182, 212, .4);
      }
      #boot .bar {
        width: 190px; height: 3px; border-radius: 3px;
        background: #1e293b; overflow: hidden;
      }
      #boot .bar i {
        display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      #boot .label { font-size: 12px; letter-spacing: .04em; }
      #boot .hint { font-size: 11px; color: #475569; max-width: 320px; text-align: center; line-height: 1.6; }
      #boot.failed .bar { display: none; }
      #boot.failed .label { color: #fda4af; }
    </style>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 antialiased overflow-hidden">
    <div id="root"></div>

    <div id="boot">
      <img src="/logo.png" alt="NexusCoder" class="mark" />
      <div class="bar"><i></i></div>
      <div class="label">Starting NexusCoder...</div>
      <div class="hint" id="boot-hint"></div>
    </div>

    <script>
      // If the app has not mounted in time, say so instead of hanging silently.
      window.__bootTimer = setTimeout(function () {
        var hint = document.getElementById('boot-hint');
        if (hint) {
          hint.textContent = 'Still loading. If this persists, close any other running NexusCoder window or dev server and reopen the app.';
        }
      }, 8000);

      window.addEventListener('error', function (e) {
        var boot = document.getElementById('boot');
        if (!boot || boot.dataset.done) return;
        boot.classList.add('failed');
        var label = document.getElementById('boot-hint');
        var title = boot.querySelector('.label');
        if (title) title.textContent = 'NexusCoder failed to start';
        if (label) label.textContent = (e && e.message) ? e.message : 'Unknown startup error. Press Ctrl+R to retry.';
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
